<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Guess my number</title>
</head>
<body>
   <header> 
      <button class="btn-again">Again !</button>
      <span class="head" >(Between 1 and 20)</span>
      <h3 class="title">Guess My Number !</h3>
      <p class="logo">?</p>
    </header>
    <main>

<section class="left-side">
    <input  type="number">
    <button class="btn-check">Check ! </button>
</section>

<section class="right-side">
<h5 id="start-guess">Start guessing ...</h5>
<h5> <span>💯</span>  Score : <span class="score">20</span> </h5>
<h5> <span>🥇</span> Highscore :  <span class="highScore">0</span> </h5>
</section>

    </main>
    


  <script src="app.js"></script>
</body>
</html>
